name: Build and deploy Node.js app to Azure Web App - god-test-frontend
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install and build
        run: |
          npm install
          npm run build

      - name: Zip artifact for deployment
        run: zip -r release.zip . -x "node_modules/.cache/*" ".git/*" ".github/*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C8802F8763A44033A1E632A642A06295 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C49FBAF48DD14F968DB0397E30A83C66 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4D3379A0A6674FBC926EB72FFA156B1B }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'god-test-frontend'
          slot-name: 'Production'
          package: release.zip
